# ==============================================================
# FleetIQ — Nginx Config (Producción VPS / Let's Encrypt)
# Scope  : Dominio real con Certbot/ACME
# Uso    : docker-compose.prod.yml → nginx.prod.conf
# ==============================================================
# ANTES DE USAR: reemplaza "tu-dominio.com" con tu dominio real
# ==============================================================

worker_processes auto;

events {
  worker_connections 2048;
  multi_accept       on;
  use                epoll;
}

http {
  include      /etc/nginx/mime.types;
  default_type application/octet-stream;

  # ── Performance ─────────────────────────────────────────────
  sendfile           on;
  tcp_nopush         on;
  tcp_nodelay        on;
  keepalive_timeout  75;
  types_hash_max_size 2048;
  client_max_body_size 20M;

  # Ocultar versión de Nginx en cabeceras
  server_tokens off;

  # ── Gzip Compression ────────────────────────────────────────
  gzip              on;
  gzip_vary         on;
  gzip_proxied      any;
  gzip_comp_level   6;
  gzip_min_length   1000;
  gzip_types
    text/plain text/css text/xml text/javascript
    application/json application/javascript application/xml
    application/rss+xml image/svg+xml font/woff2;

  # ── Rate Limiting (DDoS básico) ─────────────────────────────
  limit_req_zone $binary_remote_addr zone=app_limit:10m rate=60r/s;
  limit_req_zone $binary_remote_addr zone=api_limit:10m  rate=20r/s;
  limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

  # ── Logging ─────────────────────────────────────────────────
  log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                  '$status $body_bytes_sent "$http_referer" '
                  '"$http_user_agent" rt=$request_time';

  access_log /var/log/nginx/access.log main buffer=16k flush=5s;
  error_log  /var/log/nginx/error.log  warn;

  # ── Upstream: Next.js container ─────────────────────────────
  upstream nextjs {
    server app:3000;
    keepalive 64;
  }

  # ── HTTP (80): ACME challenge + redirect ────────────────────
  server {
    listen      80;
    server_name tu-dominio.com www.tu-dominio.com;

    # Certbot ACME challenge — DEBE estar antes del redirect
    location /.well-known/acme-challenge/ {
      root /var/www/certbot;
      try_files $uri =404;
    }

    # Todo lo demás → HTTPS
    location / {
      return 301 https://$host$request_uri;
    }
  }

  # ── HTTPS (443): servidor principal ─────────────────────────
  server {
    listen      443 ssl;
    http2       on;
    server_name tu-dominio.com www.tu-dominio.com;

    # Let's Encrypt certificates (montados vía volumen Certbot)
    ssl_certificate     /etc/letsencrypt/live/tu-dominio.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tu-dominio.com/privkey.pem;

    # Parámetros DH recomendados (generados con: openssl dhparam -out /etc/nginx/dhparam.pem 2048)
    # ssl_dhparam /etc/nginx/dhparam.pem;

    # ── TLS Hardening (A+ en SSL Labs) ──────────────────────
    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_ciphers               ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers off;
    ssl_session_cache         shared:SSL:20m;
    ssl_session_timeout       1d;
    ssl_session_tickets       off;

    # OCSP Stapling (requiere internet en el VPS)
    ssl_stapling        on;
    ssl_stapling_verify on;
    resolver            8.8.8.8 8.8.4.4 valid=300s;
    resolver_timeout    5s;

    # ── Security Headers ────────────────────────────────────
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options    "nosniff"                                      always;
    add_header X-Frame-Options           "SAMEORIGIN"                                   always;
    add_header X-XSS-Protection          "1; mode=block"                                always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin"              always;
    add_header Permissions-Policy        "camera=(), microphone=(), geolocation=(self)" always;

    # ── Static Next.js assets: cache inmutable ──────────────
    location /_next/static/ {
      proxy_pass         http://nextjs;
      proxy_http_version 1.1;
      proxy_set_header   Host $host;
      add_header         Cache-Control "public, max-age=31536000, immutable";
    }

    # ── API routes: rate limit más estricto ─────────────────
    location /api/ {
      limit_req  zone=api_limit burst=40 nodelay;
      limit_conn conn_limit 20;

      proxy_pass         http://nextjs;
      proxy_http_version 1.1;

      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;

      proxy_buffering    off;
      proxy_read_timeout 60s;
    }

    # ── App Router general ───────────────────────────────────
    location / {
      limit_req  zone=app_limit burst=120 nodelay;
      limit_conn conn_limit 50;

      proxy_pass         http://nextjs;
      proxy_http_version 1.1;

      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;

      # WebSocket / Server-Sent Events support
      proxy_set_header Upgrade    $http_upgrade;
      proxy_set_header Connection "upgrade";

      # Requerido para Next.js App Router streaming
      proxy_buffering    off;
      proxy_read_timeout 300s;
      proxy_send_timeout 300s;
    }
  }
}
