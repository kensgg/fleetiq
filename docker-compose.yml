# ==============================================================
# FleetIQ — docker-compose.yml (Desarrollo Local)
# Uso    : scripts/docker-up.ps1  ó  docker compose --env-file .env.local up --build
# ==============================================================

services:

  # ─── Next.js Application ────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # NEXT_PUBLIC_* vars se "hornean" en el bundle en tiempo de build.
        # Docker lee estos valores del --env-file o del shell.
        NEXT_PUBLIC_SUPABASE_URL:      ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
    env_file:
      - .env.local          # Variables server-side (SUPABASE_SERVICE_ROLE_KEY, etc.)
    expose:
      - "3000"              # Solo visible internamente — Nginx es el único punto de entrada
    networks:
      - fleetiq_net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # ─── Nginx Reverse Proxy (TLS termination — mkcert local) ───
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      app:
        condition: service_healthy
    networks:
      - fleetiq_net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:80 || true"]
      interval: 30s
      timeout: 5s
      retries: 3

# ── Red interna privada ────────────────────────────────────────
networks:
  fleetiq_net:
    driver: bridge
