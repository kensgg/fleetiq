# ==============================================================
# FleetIQ — Nginx Config (Local Development / mkcert)
# Scope  : localhost con certificados mkcert
# ==============================================================

worker_processes auto;

events {
  worker_connections 1024;
  multi_accept       on;
}

http {
  include      /etc/nginx/mime.types;
  default_type application/octet-stream;

  # ── Performance ─────────────────────────────────────────────
  sendfile           on;
  tcp_nopush         on;
  tcp_nodelay        on;
  keepalive_timeout  65;
  types_hash_max_size 2048;

  # ── Gzip Compression ────────────────────────────────────────
  gzip              on;
  gzip_vary         on;
  gzip_proxied      any;
  gzip_comp_level   6;
  gzip_min_length   1000;
  gzip_types
    text/plain text/css text/xml text/javascript
    application/json application/javascript application/xml
    application/rss+xml image/svg+xml font/woff2;

  # ── Rate Limiting ────────────────────────────────────────────
  # 60 req/s por IP con bursts de hasta 120 (protección básica DDoS)
  limit_req_zone $binary_remote_addr zone=app_limit:10m rate=60r/s;

  # ── Logging ─────────────────────────────────────────────────
  log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                  '$status $body_bytes_sent "$http_referer" '
                  '"$http_user_agent" "$http_x_forwarded_for"';

  access_log /var/log/nginx/access.log main;
  error_log  /var/log/nginx/error.log  warn;

  # ── Upstream: Next.js container ─────────────────────────────
  upstream nextjs {
    server app:3000;
    keepalive 32;
  }

  # ── HTTP → HTTPS redirect ───────────────────────────────────
  server {
    listen      80;
    server_name localhost;

    # Return 301 para todo el tráfico HTTP → HTTPS
    return 301 https://$host$request_uri;
  }

  # ── HTTPS server (local / mkcert) ───────────────────────────
  server {
    listen      443 ssl;
    http2       on;
    server_name localhost;

    # mkcert local certificates (generated by scripts/gen-certs.ps1)
    ssl_certificate     /etc/nginx/certs/cert.pem;
    ssl_certificate_key /etc/nginx/certs/key.pem;

    # ── TLS hardening ───────────────────────────────────────
    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_ciphers               ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers off;
    ssl_session_cache         shared:SSL:10m;
    ssl_session_timeout       1d;
    ssl_session_tickets       off;

    # ── Security Headers ────────────────────────────────────
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff"                              always;
    add_header X-Frame-Options           "SAMEORIGIN"                           always;
    add_header X-XSS-Protection          "1; mode=block"                        always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin"      always;
    add_header Permissions-Policy        "camera=(), microphone=(), geolocation=(self)" always;

    # ── Static assets: max cache, immutable ─────────────────
    location /_next/static/ {
      proxy_pass         http://nextjs;
      proxy_http_version 1.1;
      proxy_set_header   Host $host;
      add_header         Cache-Control "public, max-age=31536000, immutable";
    }

    # ── Next.js App ─────────────────────────────────────────
    location / {
      limit_req zone=app_limit burst=120 nodelay;

      proxy_pass         http://nextjs;
      proxy_http_version 1.1;

      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;

      # WebSocket / Server-Sent Events (App Router streaming)
      proxy_set_header Upgrade    $http_upgrade;
      proxy_set_header Connection "upgrade";

      # Disable buffering — required for App Router streaming
      # (Server Components, Suspense, Server Actions)
      proxy_buffering    off;
      proxy_read_timeout 300s;
      proxy_send_timeout 300s;
    }
  }
}
